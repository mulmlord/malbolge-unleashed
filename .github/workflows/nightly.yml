name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  slow-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
    strategy:
      fail-fast: false
      matrix:
        # debug is the ASan/UBSan build; release catches optimiser-dependent problems.
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # ctest exits 0 when no tests match the label, so this is safe before any slow tests exist.
      - name: Slow tests
        run: ctest --preset ${{ matrix.preset }} -L slow
